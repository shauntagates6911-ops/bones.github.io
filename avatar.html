<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>BONES Avatar</title>
<style>
body{background:#0d0d12;color:#fff;font-family:sans-serif;text-align:center;padding:40px;}
img{width:80px;height:80px;border-radius:50%;margin:10px;cursor:pointer;}
</style></head><body>
<h1>🩻 Choose Avatar</h1>
<div id="icons"></div>
<script>
const u = localStorage.getItem("bones_current");
if(!u) location.href="signin.html";

const avatars = [
  "https://i.imgur.com/1.png",
  "https://i.imgur.com/2.png",
  "https://i.imgur.com/3.png",
  "https://i.imgur.com/4.png"
];

avatars.forEach(a=>{
  const img=document.createElement("img");
  img.src=a;
  img.onclick=()=>{
    localStorage.setItem("bones_avatar_"+u,a);
    location.href="profile.html";
  };
  icons.appendChild(img);
});
</script>
</body></html>
<img id="avatar" style="width:80px;height:80px;border-radius:50%;">
const av = localStorage.getItem("bones_avatar_"+u);
if(av) avatar.src = av;
else avatar.src = "https://i.imgur.com/default.png";
