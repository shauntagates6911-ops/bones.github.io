<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>BONES OTP</title>
<style>
body{background:#0d0d12;color:#fff;font-family:sans-serif;text-align:center;padding:40px;}
input{padding:10px;margin:6px;width:200px;border-radius:6px;border:0;}
button{padding:10px 20px;border:0;border-radius:6px;background:#7f7fff;color:#000;}
</style></head><body>
<h1>🩻 Verify OTP</h1>
<p>Enter the code sent to you</p>
<input id="otp" placeholder="123456">
<button onclick="verify()">Verify</button>
<p id="msg"></p>
<script>
const u = localStorage.getItem("bones_pending");
if(!u) location.href="signup.html";

const code = localStorage.getItem("bones_otp_"+u);

function verify(){
  if(otp.value.trim() === code){
    localStorage.setItem("bones_current", u);
    localStorage.removeItem("bones_pending");
    msg.textContent="Verified!";
    location.href="profile.html";
  } else msg.textContent="Wrong code!";
}
</script>
</body></html>
